services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bettercast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bettercast
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bettercast"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: server/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://bettercast:${POSTGRES_PASSWORD}@db:5432/bettercast?sslmode=disable
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: { context: ., dockerfile: server/Dockerfile }
    restart: unless-stopped
    command: ["--worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://bettercast:${POSTGRES_PASSWORD}@db:5432/bettercast?sslmode=disable
    depends_on: { db: { condition: service_healthy } }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]

volumes:
  db:
  caddy_data:
